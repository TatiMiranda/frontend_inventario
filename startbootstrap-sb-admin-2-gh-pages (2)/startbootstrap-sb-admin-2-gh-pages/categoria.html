<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Categorías</title>
    <link href="css/sb-admin-2.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<style>
    body {
        background-color: #f8f9fc;
        font-family: 'Nunito', sans-serif;
    }
    .card {
        border: none;
        border-radius: 0.75rem;
        box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.1);
    }
    h1 {
        color: #5a5c69;
        font-weight: bold;
    }
    .btn-primary {
        background-color: #4e73df;
        border-color: #4e73df;
    }
    .btn-primary:hover {
        background-color: #2e59d9;
        border-color: #2e59d9;
    }
</style>
<body>

<div class="d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow-lg p-4 rounded" style="max-width: 800px; width: 100%;">
        
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="h3">Categorías</h1>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalCategoria">
                Crear nueva categoría
            </button>
        </div>

        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Categoría</th>
                    <th class="text-end">Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Electrónica</td>
                    <td class="text-end">
                        <button class="btn btn-sm btn-warning me-2">Actualizar</button>
                        <button class="btn btn-sm btn-danger">Eliminar</button>
                    </td>
                </tr>
                <tr>
                    <td>Muebles</td>
                    <td class="text-end">
                        <button class="btn btn-sm btn-warning me-2">Actualizar</button>
                        <button class="btn btn-sm btn-danger">Eliminar</button>
                    </td>
                </tr>
            </tbody>
        </table>
        
    </div>
</div>

<div class="modal fade" id="modalCategoria" tabindex="-1" aria-labelledby="modalCategoriaLabel" aria-hidden="true">
    <div class="modal-dialog **modal-xl**">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalCategoriaLabel">Crear nueva categoría</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="form-categoria">
                    <div class="form-group mb-3">
                        <label for="nombre-categoria">Nombre de la categoría</label>
                        <input type="text" class="form-control" id="nombre-categoria" required>
                    </div>
                    <div class="d-flex justify-content-end">
                        <button type="submit" class="btn btn-primary">Agregar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.getElementById('form-categoria').addEventListener('submit', function(e) {
        e.preventDefault();
        const nombre = document.getElementById('nombre-categoria').value.trim();
        if(nombre) {
            const tableBody = document.querySelector('table tbody');
            const newRow = document.createElement('tr');
            newRow.innerHTML = `
                <td>${nombre}</td>
                <td class="text-end">
                    <button class="btn btn-sm btn-warning me-2">Actualizar</button>
                    <button class="btn btn-sm btn-danger">Eliminar</button>
                </td>
            `;
            tableBody.appendChild(newRow);

            document.getElementById('form-categoria').reset();
            const modal = bootstrap.Modal.getInstance(document.getElementById('modalCategoria'));
            modal.hide();
        }
    });
</script>

</body>
</html>
