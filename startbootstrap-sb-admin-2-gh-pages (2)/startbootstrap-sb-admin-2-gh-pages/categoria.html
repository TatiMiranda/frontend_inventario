<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Categorías</title>
    <link href="css/sb-admin-2.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnIkB8y3W6k53kP2C5KqK6GkC/2q1/4Q" crossorigin="anonymous">
</head>
<style>
    /* Custom Styles for a modern look */
    body {
        background-color: #f8f9fc;
        font-family: 'Nunito', sans-serif;
    }
    .container {
        max-width: 800px;
    }
    .card {
        border: none;
        border-radius: 0.75rem;
        box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.1);
        transition: transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
    }
    .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 1rem 2rem rgba(0, 0, 0, 0.15);
    }
    .card-header {
        background-color: #4e73df;
        color: white;
        font-weight: bold;
        border-top-left-radius: 0.75rem;
        border-top-right-radius: 0.75rem;
    }
    .list-group-item {
        border-left: 5px solid transparent;
        transition: border-left 0.3s ease-in-out, background-color 0.3s ease-in-out;
    }
    .list-group-item:hover {
        background-color: #e9ecef;
        border-left: 5px solid #4e73df;
    }
    .list-group {
        border-radius: 0.75rem;
        overflow: hidden;
        box-shadow: 0 0.25rem 0.75rem rgba(0, 0, 0, 0.05);
    }
    .btn-primary {
        background-color: #4e73df;
        border-color: #4e73df;
        transition: background-color 0.3s ease-in-out, transform 0.2s ease-in-out;
    }
    .btn-primary:hover {
        background-color: #2e59d9;
        border-color: #2e59d9;
        transform: scale(1.05);
    }
    h1 {
        color: #5a5c69;
        font-weight: bold;
    }
    /* Simple animation for new items */
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .list-group-item.new-item {
        animation: fadeIn 0.5s ease-in-out;
    }
</style>
<body>

    <nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
        <div class="container-fluid">
            <img src="img/logo-white.png" alt="Logo" width="70" height="24" class="d-inline-block align-text-top me-2">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        
                </ul>
                 <form class="form-inline my-2 my-lg-0 ml-auto">
                    <input class="form-control mr-sm-2" type="search" placeholder="Buscar">
                    <button class="btn btn-outline-light my-2 my-sm-0" type="submit">Buscar</button>
                </form>
            </div>
        </div>
    </nav>
<div class="d-flex justify-content-center align-items-center vh-100 mg-2">
    <div class="card shadow-lg p-4 rounded" style="max-width: 800px; width: 100%; height: 70%;">
        <h1 class="mb-4 text-center mb-4">Categorías</h1>
        
        <!-- Lista de categorías -->
        <ul class="list-group mb-4 mt-4" id="lista-categorias">
            <li class="list-group-item">Electrónica</li>
            <li class="list-group-item">Muebles</li>
        </ul>
        
        <!-- Formulario -->
        <div class="card">
            <div class="card-header bg-primary text-white">
                Agregar nueva categoría
            </div>
            <div class="card-body">
                <form id="form-categoria">
                    <div class="form-group">
                        <label for="nombre-categoria">Nombre de la categoría</label>
                        <input type="text" class="form-control" id="nombre-categoria" required>
                    </div>

                    <div class="d-flex justify-content-between">
                        <button type="submit" class="btn bg-primary btn-primary">Agregar</button>
                        <a href="index.html" class="btn bg-primary btn-primary">Atrás</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <script>
        document.getElementById('form-categoria').addEventListener('submit', function(e) {
            e.preventDefault();
            const nombre = document.getElementById('nombre-categoria').value.trim();
            if(nombre) {
                const li = document.createElement('li');
                li.className = 'list-group-item new-item';
                li.textContent = nombre;
                document.getElementById('lista-categorias').appendChild(li);
                document.getElementById('form-categoria').reset();
            }
        });
    </script>
</body>
</html>
