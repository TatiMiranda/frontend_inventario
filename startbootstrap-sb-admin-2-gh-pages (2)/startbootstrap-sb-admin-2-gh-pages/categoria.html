<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABAI Dashboard - Categorías</title>
    <!-- Incluye Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Iconos de Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <!-- Estilos CSS personalizados para la interfaz -->
    <style>
        :root {
            --primary-blue: #1b263b; /* Azul marino para el fondo sólido */
            --gradient-start: #4facfe; /* El azul claro del degradado */
            --gradient-end: #1b263b; /* El azul oscuro del degradado */
            --font-family-base: 'Segoe UI', Roboto, Arial, sans-serif;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Evita barras de desplazamiento innecesarias */
            font-family: var(--font-family-base);
        }

        #wrapper {
            display: flex;
            height: 100vh; /* Ocupa el 100% de la altura de la vista */
            width: 100%;
        }

        #sidebar-wrapper {
            min-height: 100vh;
            width: 250px;
            flex-shrink: 0;
            transition: margin-left .25s ease-out;
            /* Aplicación del degradado de color */
            background: linear-gradient(180deg, var(--gradient-start) 0%, var(--gradient-end) 100%);
        }
        
        .bg-dark-blue {
            /* Ahora este color se usa para los elementos dentro del sidebar, como los enlaces */
            background-color: var(--primary-blue) !important;
        }

        .sidebar-heading {
            padding: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo {
            width: 40px;
            height: 40px;
            margin-right: 10px;
        }

        .logo-text {
            font-size: 1.8rem; /* Aumenta el tamaño del texto del logo */
            font-weight: 700;
            color: #fff;
            margin: 0;
        }
        
        #page-content-wrapper {
            flex-grow: 1; /* Permite que el contenido principal ocupe todo el espacio restante */
        }

        .list-group-item {
            border-left: 0;
            border-right: 0;
            border-radius: 0;
            font-weight: 500;
            transition: background-color 0.3s ease;
        }

        .list-group-item.active {
            background-color: rgba(255, 255, 255, 0.15) !important;
            border-left: 5px solid var(--light-blue); /* La barra verde de resalte */
            padding-left: 1rem !important; /* Ajuste para el padding */
        }

        .list-group-item:hover {
            background-color: rgba(255, 255, 255, 0.1) !important;
            color: #fff;
        }

        .btn-primary {
            background-color: #0d6efd;
            border-color: #0d6efd;
        }

        .btn-primary:hover {
            background-color: #0b5ed7;
            border-color: #0a58ca;
        }

        .table thead th {
            background-color: #e9ecef;
            font-weight: 600;
        }

        .table-striped > tbody > tr:nth-of-type(odd) {
            background-color: rgba(0, 0, 0, 0.03);
        }

        .pagination .page-item.active .page-link {
            background-color: #0d6efd;
            border-color: #0d6efd;
            color: #fff;
        }

        .pagination .page-link {
            color: var(--primary-blue);
        }
        
        /* Flexbox para que la tarjeta de categorías crezca */
        .d-flex.flex-column {
            height: 100%;
        }

        .card {
            flex-grow: 1;
        }

        .table-responsive {
            flex-grow: 1;
            overflow-y: auto; /* Permite desplazamiento si la tabla es muy larga */
        }

        .mt-auto {
            margin-top: auto !important;
        }
    </style>
</head>
<body>
    <div class="d-flex" id="wrapper">
        <!-- Sidebar -->
        <div class="bg-dark-blue border-end" id="sidebar-wrapper">
            <div class="sidebar-heading">
                <img src="img/logo_principal_abai-removebg-preview.png" alt="ABAI Logo" class="logo" style="width: 56%;">
                <!-- <h1 style="color: #fff;">GROUP</h1> -->
                
            </div>
            <div class="list-group list-group-flush">
                <a href="dashboard.html" class="list-group-item list-group-item-action active  bg-dark-blue text-white p-3"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
                <a href="equipos.html" class="list-group-item list-group-item-action active bg-dark-blue text-white p-3"><i class="bi bi-laptop me-2"></i> Equipos</a>
                <a href="categoria.html" class="list-group-item list-group-item-action active  bg-dark-blue text-white p-3"><i class="bi bi-tags-fill me-2"></i> Categorías</a>
                <a href="sedes.html" class="list-group-item list-group-item-action active bg-dark-blue text-white p-3"><i class="bi bi-building me-2"></i> Sedes</a>
                <a href="seguimiento.html" class="list-group-item list-group-item-action active bg-dark-blue text-white p-3"><i class="bi bi-graph-up-arrow me-2"></i> Seguimiento</a>
                <a href="stock.html" class="list-group-item list-group-item-action active bg-dark-blue text-white p-3"><i class="bi bi-box-seam me-2"></i> Stock</a>
                <a href="centro_costos.html" class="list-group-item list-group-item-action active bg-dark-blue text-white p-3"><i class="bi bi-cash-stack me-2"></i> Centro de Costos</a>
                <a href="provedor.html" class="list-group-item list-group-item-action active bg-dark-blue text-white p-3"><i class="bi bi-truck-flatbed me-2"></i> Proveedores</a>
            </div>
            
        </div>
        <!-- /#sidebar-wrapper -->

        <!-- Page Content -->
        <div id="page-content-wrapper" class="w-100 bg-light">
            <div class="container-fluid py-5 h-100 d-flex flex-column">
                <div class="mx-auto" style="max-width: 1300px; width: 100%;">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h1 class="h3">Categorías</h1>
                        <div class="d-flex justify-content-end">
                            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalCategoria">
                                Crear nueva categoría
                            </button>
                            <a href="equipos.html" class="btn btn-primary ms-2">
                                Ver Equipos
                            </a>
                        </div>
                    </div>
                    
                    <div class="card p-3 shadow-sm flex-grow-1 d-flex flex-column">
                        <div class="table-responsive flex-grow-1">
                            <table class="table table-striped table-hover mb-0">
                                <thead>
                                    <tr>
                                        <th>Nombre de la Categoría</th>
                                        <th>Descripción</th>
                                        <th class="text-end">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td>Electrónica</td>
                                        <td>descripcion de tecnologia</td>
                                        <td class="text-end">
                                            <button class="btn btn-warning btn-sm me-2"><i class="bi bi-pencil-fill"></i> Editar</button>
                                            <button class="btn btn-danger btn-sm"><i class="bi bi-trash-fill"></i> Eliminar</button>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td>Mueble</td>
                                        <td>descripcion del mueble</td>
                                        <td class="text-end">
                                            <button class="btn btn-warning btn-sm me-2"><i class="bi bi-pencil-fill"></i> Editar</button>
                                            <button class="btn btn-danger btn-sm"><i class="bi bi-trash-fill"></i> Eliminar</button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        
                        <div class="d-flex justify-content-center mt-5 mb-5" style="font-size: 0.75rem;">
                            <button id="btnAnterior" class="btn btn-outline-primary btn-xs me-1 py-0 px-2" style="font-size: 0.75rem; height: 1.5rem; line-height: 1;">Anterior</button>
                            <span id="paginaActual" class="align-self-center mx-1 text-primary" style="font-size: 0.75rem;"></span>
                            <button id="btnSiguiente" class="btn btn-outline-primary btn-xs ms-1 py-0 px-2" style="font-size: 0.75rem; height: 1.5rem; line-height: 1;">Siguiente</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Modal Crear Nueva Categoría -->
<div class="modal fade" id="modalCategoria" tabindex="-1" aria-labelledby="modalCategoriaLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalCategoriaLabel">Crear nueva categoría</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        <form id="form-categoria">
          <div class="mb-3">
            <label for="nombreCategoria" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="nombreCategoria" required>
          </div>
          <div class="mb-3">
            <label for="descripcionCategoria" class="form-label">Descripción</label>
            <input type="text" class="form-control" id="descripcionCategoria">
          </div>
          <div class="d-flex justify-content-end">
            <button type="submit" class="btn btn-primary">Agregar</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
    <!-- Incluye Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
