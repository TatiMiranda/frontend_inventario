<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso a Abai Group</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* Variables CSS para colores más fáciles de manejar */
        :root {
            --primary-blue: #0a58a7;
            --secondary-blue: #06396e;
            --text-color: #333;
            --container-bg: rgba(255, 255, 255, 0.95);
            --shadow-color: rgba(0, 0, 0, 0.1);
        }

        /* Estilos generales y para el fondo de video */
        body {
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: var(--text-color);
        }

        #video-background {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -100;
            background-size: cover;
            /* Filtro de oscuridad para que el formulario se vea mejor */
            filter: brightness(0.7);
        }

        /* Estilos del contenedor del formulario */
        .login-container {
            background-color: var(--container-bg);
            padding: 50px 40px; /* Padding ajustado para más espacio */
            border-radius: 10px;
            box-shadow: 0 8px 25px var(--shadow-color); /* Sombra más suave */
            text-align: center;
            width: 380px;
            max-width: 90%;
            z-index: 1;
            /* Agregamos una transición suave al contenedor */
            transition: transform 0.3s ease;
        }

        /* Efecto de "levantar" el contenedor al pasar el mouse */
        .login-container:hover {
            transform: translateY(-5px);
        }

        .login-logo {
            width: 120px; /* Tamaño del logo */
            margin-bottom: 25px;
        }

        .login-container h1 {
            font-size: 1.8em; /* Tamaño de fuente ajustado */
            margin-bottom: 25px;
            color: var(--primary-blue);
            font-weight: bold;
        }
        
        /* Estilos para los campos de entrada */
        .input-group {
            margin-bottom: 20px; /* Espacio entre grupos de input */
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }

        .input-group input {
            width: 100%;
            padding: 15px; /* Padding aumentado para un mejor tacto */
            border: 1px solid #ddd;
            border-radius: 8px; /* Bordes más redondeados */
            box-sizing: border-box;
            transition: all 0.3s ease; /* Transición para efectos */
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--primary-blue); /* Borde de color al seleccionar el campo */
            box-shadow: 0 0 8px rgba(10, 88, 167, 0.2);
        }

        /* Estilos para el botón de Ingresar */
        .login-button {
            width: 100%;
            padding: 15px;
            border: none;
            background-color: var(--primary-blue);
            color: white;
            font-size: 1em;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .login-button:hover {
            background-color: var(--secondary-blue);
            transform: translateY(-2px); /* Efecto de "levantar" el botón */
        }

        /* Estilos para el enlace de registro */
        .signup-link {
            margin-top: 25px;
            font-size: 0.9em;
        }

        .signup-link a {
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s ease;
        }

        .signup-link a:hover {
            color: var(--secondary-blue);
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <video autoplay loop muted playsinline id="video-background">
        <source src="tu-video.mp4" type="video/mp4">
    </video>

    <div class="login-container">
        <img src="img/logo_principal_abai-removebg-preview.png" alt="Abai Group Logo" class="login-logo">
        <h1>Iniciar Sesión</h1>
        <form action="#" method="POST">
            <div class="input-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" name="username" placeholder="Ingresa tu nombre de usuario" required>
            </div>
            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required>
            </div>
            <button type="submit" class="login-button">Ingresar</button>
        </form>
        <div class="signup-link">
            ¿No tienes una cuenta? <a href="#">Regístrate aquí</a>
        </div>
    </div>

</body>
</html>
